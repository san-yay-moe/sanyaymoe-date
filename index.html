<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စမ်းရေမိုး - ဇာတ်ပွဲအချိန်ဇယား</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        .swiper { width: 100%; height: 300px; border-radius: 1rem; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-indigo-600 text-white px-6 py-3 rounded-xl shadow-2xl">
        <span id="toast-msg"></span>
    </div>

    <header class="bg-gradient-to-r from-indigo-900 to-indigo-700 text-white py-10 px-4 text-center">
        <h1 class="text-4xl font-extrabold mb-2">စမ်းရေမိုး</h1>
        <p class="text-indigo-200 text-lg">၂၀၂၆-၂၀၂၇ ဇာတ်ပွဲများ အချိန်ဇယား</p>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="swiper mySwiper mb-10 shadow-xl">
            <div class="swiper-wrapper" id="swiper-wrapper">
                <div class="swiper-slide"><img src="https://placehold.co/1200x400/4f46e5/ffffff?text=စမ်းရေမိုး+ဇာတ်ပွဲများ" alt="Banner"></div>
            </div>
        </div>

        <section class="bg-white rounded-3xl shadow-sm border border-gray-100 p-6">
            <h2 class="text-2xl font-bold mb-6 text-indigo-900 flex items-center">
                <span class="mr-2">📅</span> လာမည့် ပွဲစဉ်များ
            </h2>
            <div id="schedule-body" class="space-y-4">
                <p class="text-gray-400">Loading...</p>
            </div>
        </section>

        <section class="mt-16 border-t pt-10">
            <div id="login-form" class="max-w-sm mx-auto bg-white p-8 rounded-3xl shadow-lg border border-indigo-100">
                <h3 class="text-center font-bold text-gray-700 mb-4">Admin အကောင့်ဝင်ရန်</h3>
                <input id="adminPass" type="password" placeholder="စကားဝှက်" class="w-full p-3 mb-4 rounded-xl border border-gray-200">
                <button onclick="checkAdmin()" class="w-full bg-indigo-900 text-white py-3 rounded-xl font-bold hover:bg-indigo-800 transition">ဝင်မည်</button>
            </div>
            
            <div id="admin-controls" class="hidden bg-white p-8 rounded-3xl shadow-xl space-y-8">
                <h3 class="text-2xl font-bold text-indigo-900">Admin Control Panel</h3>
                <div class="grid grid-cols-1 gap-4">
                    <input id="dateInput" type="text" placeholder="နေ့စွဲ (ဥပမာ - ၁-၁၁-၂၀၂၆)" class="p-4 rounded-xl border">
                    <input id="locInput" type="text" placeholder="နေရာ" class="p-4 rounded-xl border">
                    <input id="troupeInput" type="text" placeholder="ဇာတ်အဖွဲ့" class="p-4 rounded-xl border">
                    <button onclick="addEvent()" class="bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700">ပွဲစဉ် တင်မည်</button>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // IMPORTANT: Replace this with your actual config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.notify = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };

        window.addEvent = async () => {
            const date = document.getElementById('dateInput').value;
            const location = document.getElementById('locInput').value;
            const troupe = document.getElementById('troupeInput').value;

            if (!date || !location || !troupe) {
                notify("အချက်အလက်အားလုံးဖြည့်ပေးပါ။");
                return;
            }

            try {
                await addDoc(collection(db, "events"), {
                    date,
                    location,
                    troupe,
                    timestamp: serverTimestamp()
                });
                notify("အောင်မြင်စွာ တင်ပြီးပါပြီ။");
                document.getElementById('dateInput').value = '';
                document.getElementById('locInput').value = '';
                document.getElementById('troupeInput').value = '';
            } catch (e) {
                console.error(e);
                notify("အမှားအယွင်းရှိပါသည်။");
            }
        };

        window.checkAdmin = () => {
            if (document.getElementById('adminPass').value === "1234") {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
            } else notify("စကားဝှက်မှားနေပါသည်။");
        };

        onSnapshot(query(collection(db, "events"), orderBy("timestamp", "desc")), (snapshot) => {
            const container = document.getElementById('schedule-body');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const event = doc.data();
                container.innerHTML += `
                    <div class="flex items-center p-4 border-b border-gray-50 hover:bg-gray-50 transition rounded-xl">
                        <div class="bg-indigo-100 text-indigo-900 font-bold px-4 py-2 rounded-lg mr-4 text-sm">${event.date}</div>
                        <div>
                            <div class="font-bold text-gray-800">${event.location}</div>
                            <div class="text-sm text-indigo-600">${event.troupe}</div>
                        </div>
                    </div>
                `;
            });
        });
    </script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
</body>
</html>
