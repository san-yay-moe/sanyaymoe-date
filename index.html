<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စမ်းရေမိုး - ဇာတ်ပွဲအချိန်ဇယား</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;600;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; height: 100vh; overflow: hidden; background-color: #f1f5f9; }
        .table-container { max-height: calc(100vh - 200px); overflow-y: auto; }
        .table-container::-webkit-scrollbar { width: 4px; }
        .table-container::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-800">

    <header class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 text-white py-3.5 px-4 text-center shadow-lg flex-shrink-0 border-b border-indigo-700/50">
        <h1 class="text-base font-bold tracking-wide">စမ်းရေမိုး</h1>
        <p class="text-indigo-200 text-[10px] font-medium tracking-wider opacity-90">ဇာတ်ပွဲများ အချိန်ဇယား</p>
    </header>

    <main class="flex-1 p-3 sm:p-4 overflow-hidden flex flex-col max-w-md w-full mx-auto">
        <section class="bg-white rounded-2xl shadow-md border border-slate-200/80 flex-1 flex flex-col overflow-hidden">
            
            <div id="data-view" class="flex flex-col h-full p-3">
                <div class="relative mb-3">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400 text-xs">🔍</span>
                    <input type="text" id="searchInput" placeholder="ရက်စွဲ (သို့) နေရာဖြင့် ရှာရန်..." oninput="renderEvents()" class="w-full pl-8 pr-3 py-2.5 text-xs rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 outline-none transition-all">
                </div>
                
                <div class="table-container flex-1 border border-slate-100 rounded-xl overflow-hidden shadow-inner">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead class="bg-indigo-50/80 sticky top-0 text-indigo-900 font-bold text-[10px] uppercase tracking-wider border-b border-indigo-100 backdrop-blur-sm">
                            <tr>
                                <th class="px-3 py-2.5 whitespace-nowrap">ရက်စွဲ</th>
                                <th class="px-3 py-2.5">နေရာ</th>
                                <th class="px-3 py-2.5">ဇာတ်</th>
                                <th class="px-3 py-2.5 text-center">ဆက်သွယ်ရန်</th>
                                <th class="px-3 py-2.5 text-center">အခြေအနေ</th>
                            </tr>
                        </thead>
                        <tbody id="schedule-body" class="divide-y divide-slate-100 bg-white"></tbody>
                    </table>
                </div>
            </div>

            <div id="admin-view" class="hidden flex-1 p-4 overflow-y-auto">
                <div id="login-form" class="max-w-xs mx-auto my-auto pt-6">
                    <input id="adminPass" type="password" placeholder="စကားဝှက်" class="w-full p-2.5 text-xs rounded-xl border border-slate-200 mb-3 outline-none">
                    <button onclick="checkAdmin()" class="w-full bg-indigo-900 text-white py-2.5 rounded-xl text-xs font-bold">ဝင်မည်</button>
                </div>
                <div id="admin-controls" class="hidden space-y-3 pt-2">
                    <input id="dateInput" type="date" class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-slate-50">
                    <input id="locInput" type="text" placeholder="နေရာ" class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-slate-50">
                    <input id="troupeInput" type="text" placeholder="ဇာတ်အဖွဲ့" class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-slate-50">
                    <input id="phoneInput" type="text" placeholder="ဆက်သွယ်ရန် ဖုန်းနံပါတ်" class="w-full p-2.5 text-xs rounded-xl border border-slate-200 bg-slate-50">
                    <button onclick="addEvent()" class="w-full bg-emerald-600 text-white py-3 rounded-xl text-xs font-bold">ပွဲစဉ် ထည့်မည်</button>
                </div>
            </div>
        </section>
    </main>

    <nav class="bg-white border-t p-2.5 z-50 flex-shrink-0">
        <div class="flex gap-2 max-w-md mx-auto">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2.5 text-[11px] font-bold rounded-xl bg-indigo-900 text-white">လာမည့်</button>
            <button onclick="switchTab('done')" id="tab-done" class="flex-1 py-2.5 text-[11px] font-bold rounded-xl bg-slate-100 text-slate-600">ပြီးဆုံး</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-2.5 text-[11px] font-bold rounded-xl bg-slate-100 text-slate-600">Admin</button>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBbRZLUYHeVThoCscb2ul_JURGsfBjCF4s", projectId: "birthday-62720" }));
        let isAdmin = false, currentTab = 'active', allEvents = [];

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('data-view').classList.toggle('hidden', currentTab === 'admin');
            document.getElementById('admin-view').classList.toggle('hidden', currentTab !== 'admin');
            renderEvents();
        };

        window.checkAdmin = () => {
            if (document.getElementById('adminPass').value === "1234") {
                isAdmin = true;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
            }
        };

        window.addEvent = async () => {
            const rawDate = document.getElementById('dateInput').value;
            const location = document.getElementById('locInput').value.trim();
            const troupe = document.getElementById('troupeInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();
            
            if (!rawDate || !location || !troupe) return alert("အချက်အလက်ဖြည့်ပါ");
            
            const p = rawDate.split('-');
            await addDoc(collection(db, "events"), { 
                date: `${parseInt(p[2])}/${parseInt(p[1])}/${p[0]}`, 
                rawDate: rawDate, location, troupe, phone, completed: false 
            });
            alert("ထည့်သွင်းပြီးပါပြီ");
        };

        window.markCompleted = async (id) => await updateDoc(doc(db, "events", id), { completed: true });
        window.deleteEvent = async (id) => await deleteDoc(doc(db, "events", id));

        window.renderEvents = () => {
            const container = document.getElementById('schedule-body');
            const search = document.getElementById('searchInput').value.toLowerCase();
            let filtered = allEvents.filter(e => currentTab === 'active' ? !e.completed : e.completed);
            
            if (search) filtered = filtered.filter(e => e.date.includes(search) || e.location.toLowerCase().includes(search));
            
            const sorted = filtered.sort((a, b) => new Date(a.rawDate) - new Date(b.rawDate));

            container.innerHTML = sorted.length ? sorted.map(e => `
                <tr class="border-b">
                    <td class="px-3 py-3 text-indigo-950 font-bold">${e.date}</td>
                    <td class="px-3 py-3 text-slate-800">${e.location}</td>
                    <td class="px-3 py-3 text-slate-600">${e.troupe}</td>
                    <td class="px-3 py-3 text-center">
                        ${e.phone ? `<a href="tel:${e.phone}" class="text-indigo-600 font-bold underline text-[10px]">${e.phone}</a>` : '-'}
                    </td>
                    <td class="px-3 py-3 text-center">
                        ${isAdmin ? `<button onclick="markCompleted('${e.id}')" class="text-green-600 p-1">✔️</button><button onclick="deleteEvent('${e.id}')" class="text-red-600 p-1">❌</button>` 
                        : (e.completed ? '✅' : '🔥')}
                    </td>
                </tr>
            `).join('') : '<tr><td colspan="5" class="text-center py-8 text-slate-400">ပွဲစဉ်မရှိသေးပါ။</td></tr>';
        };

        onSnapshot(query(collection(db, "events")), (s) => {
            allEvents = []; s.forEach(d => allEvents.push({ id: d.id, ...d.data() })); 
            renderEvents();
        });
    </script>
</body>
</html>
