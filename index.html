<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စမ်းရေမိုး - ဇာတ်ပွဲအချိန်ဇယား</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
        .swiper { width: 100%; height: 350px; border-radius: 1.5rem; }
        .swiper-slide img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="toast" class="fixed top-5 right-5 z-50 hidden bg-emerald-600 text-white px-6 py-3 rounded-2xl shadow-xl transition-all">
        <span id="toast-msg"></span>
    </div>

    <header class="bg-indigo-900 text-white py-12 px-4 text-center shadow-lg">
        <h1 class="text-4xl font-bold mb-2">စမ်းရေမိုး</h1>
        <p class="text-indigo-200">၂၀၂၆-၂၀၂၇ ဇာတ်ပွဲများ အချိန်ဇယား</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <div class="swiper mySwiper mb-8 shadow-2xl">
            <div class="swiper-wrapper" id="swiper-wrapper">
                <div class="swiper-slide"><img src="https://placehold.co/800x400/4f46e5/ffffff?text=စမ်းရေမိုး+ဇာတ်ပွဲများ" alt="Banner"></div>
            </div>
        </div>

        <section class="bg-white rounded-3xl shadow-sm border border-slate-100 p-6 mb-12">
            <h2 class="text-2xl font-bold mb-6 text-indigo-900 flex items-center">📅 လာမည့် ပွဲစဉ်များ</h2>
            <div id="schedule-body" class="space-y-4">
                <p class="text-slate-400 text-center">Data များတင်နေသည်...</p>
            </div>
        </section>

        <section class="mt-8">
            <div id="login-form" class="max-w-md mx-auto bg-white p-8 rounded-3xl shadow-lg border border-indigo-100">
                <h3 class="font-bold text-slate-700 mb-4 text-center">Admin အကောင့်ဝင်ရန်</h3>
                <input id="adminPass" type="password" placeholder="စကားဝှက်" class="w-full p-4 mb-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="checkAdmin()" class="w-full bg-indigo-900 text-white py-4 rounded-xl font-bold hover:bg-indigo-800 transition">ဝင်မည်</button>
            </div>
            
            <div id="admin-controls" class="hidden bg-white p-8 rounded-3xl shadow-xl space-y-4 border border-indigo-100">
                <h3 class="text-xl font-bold text-indigo-900 mb-4">Admin Control Panel</h3>
                <input id="dateInput" type="text" placeholder="နေ့စွဲ (ဥပမာ - ၁-၁၁-၂၀၂၆)" class="w-full p-4 rounded-xl border">
                <input id="locInput" type="text" placeholder="နေရာ" class="w-full p-4 rounded-xl border">
                <input id="troupeInput" type="text" placeholder="ဇာတ်အဖွဲ့" class="w-full p-4 rounded-xl border">
                <button onclick="addEvent()" class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold hover:bg-emerald-700 transition">ပွဲစဉ် တင်မည်</button>
                <button onclick="location.reload()" class="w-full text-slate-400 py-2 hover:text-slate-600">ထွက်မည်</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.notify = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };

        window.addEvent = async () => {
            const date = document.getElementById('dateInput').value;
            const location = document.getElementById('locInput').value;
            const troupe = document.getElementById('troupeInput').value;

            if (!date || !location || !troupe) { notify("အချက်အလက်အားလုံးဖြည့်ပါ။"); return; }

            try {
                await addDoc(collection(db, "events"), { date, location, troupe, timestamp: serverTimestamp() });
                notify("အောင်မြင်စွာ တင်ပြီးပါပြီ။");
                document.getElementById('dateInput').value = '';
                document.getElementById('locInput').value = '';
                document.getElementById('troupeInput').value = '';
            } catch (e) { notify("အမှားအယွင်းရှိပါသည်။"); }
        };

        window.checkAdmin = () => {
            if (document.getElementById('adminPass').value === "1234") {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
            } else notify("စကားဝှက်မှားနေပါသည်။");
        };

        onSnapshot(query(collection(db, "events"), orderBy("timestamp", "desc")), (snapshot) => {
            const container = document.getElementById('schedule-body');
            container.innerHTML = '';
            snapshot.forEach((doc) => {
                const e = doc.data();
                container.innerHTML += `
                    <div class="flex items-center p-4 border border-slate-50 bg-slate-50 rounded-2xl">
                        <div class="bg-indigo-900 text-white font-bold px-4 py-2 rounded-xl mr-4 text-xs">${e.date}</div>
                        <div>
                            <div class="font-bold text-slate-800">${e.location}</div>
                            <div class="text-sm text-indigo-700">${e.troupe}</div>
                        </div>
                    </div>`;
            });
        });
    </script>
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script>new Swiper(".mySwiper", { loop: true, autoplay: { delay: 3000 } });</script>
</body>
</html>
