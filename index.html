<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စမ်းရေမိုး - ဇာတ်ပွဲအချိန်ဇယား</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

    <div id="toast" class="fixed top-5 left-5 right-5 z-50 hidden bg-indigo-900 text-white px-6 py-3 rounded-xl shadow-lg text-center">
        <span id="toast-msg"></span>
    </div>

    <header class="bg-indigo-900 text-white py-6 px-4 text-center shadow-lg">
        <h1 class="text-2xl font-bold">စမ်းရေမိုး</h1>
        <p class="text-indigo-200 text-sm">ဇာတ်ပွဲများ အချိန်ဇယား</p>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">
        <section class="mb-6">
            <div class="aspect-video w-full rounded-2xl overflow-hidden shadow-md bg-slate-900">
                <iframe id="video-frame" class="w-full h-full" 
                        src="https://www.youtube.com/embed/v55HWADK2MU?modestbranding=1&rel=0&showinfo=0&controls=1&iv_load_policy=3&disablekb=1&fs=1&playsinline=1" 
                        frameborder="0" allowfullscreen></iframe>
            </div>
        </section>

        <!-- Tabs -->
        <div class="flex bg-white rounded-2xl p-1 shadow-sm mb-4 border border-slate-100">
            <button onclick="switchTab('active')" id="tab-active" class="flex-1 py-2 text-sm font-bold rounded-xl bg-indigo-900 text-white">လာမည့်ပွဲ</button>
            <button onclick="switchTab('done')" id="tab-done" class="flex-1 py-2 text-sm font-bold rounded-xl text-slate-500">ပြီးဆုံးပွဲ</button>
        </div>

        <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-6">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-slate-500 uppercase">
                    <tr>
                        <th class="px-2 py-3">နေ့စွဲ</th>
                        <th class="px-2 py-3">နေရာ</th>
                        <th class="px-2 py-3">ဇာတ်အဖွဲ့</th>
                        <th class="px-2 py-3 text-center">လုပ်ဆောင်ချက်</th>
                    </tr>
                </thead>
                <tbody id="schedule-body" class="divide-y divide-slate-100">
                    <tr><td colspan="4" class="text-slate-400 text-center py-4">Data များတင်နေသည်...</td></tr>
                </tbody>
            </table>
        </section>

        <section id="admin-section" class="mt-8">
            <div id="login-form" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <input id="adminPass" type="password" placeholder="Admin စကားဝှက်" class="w-full p-3 mb-3 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="checkAdmin()" class="w-full bg-indigo-900 text-white py-2.5 rounded-xl font-bold">Admin ဝင်မည်</button>
            </div>
            
            <div id="admin-controls" class="hidden bg-white p-5 rounded-2xl shadow-sm border border-indigo-100 space-y-3">
                <h3 class="font-bold text-indigo-900 border-b pb-2">Admin Control</h3>
                <input id="videoLink" type="text" placeholder="Video ID (e.g. v55HWADK2MU)" class="w-full p-2.5 rounded-xl border">
                <button onclick="updateVideo()" class="w-full bg-blue-600 text-white py-2 rounded-xl text-sm">ဗီဒီယို ပြောင်းမည်</button>
                <div class="my-2 border-t pt-2">
                    <input id="dateInput" type="text" placeholder="နေ့စွဲ (DD/MM/YYYY)" class="w-full p-2.5 rounded-xl border mb-2">
                    <input id="locInput" type="text" placeholder="နေရာ" class="w-full p-2.5 rounded-xl border mb-2">
                    <input id="troupeInput" type="text" placeholder="ဇာတ်အဖွဲ့" class="w-full p-2.5 rounded-xl border mb-2">
                    <button onclick="addEvent()" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold">ပွဲစဉ် တင်မည်</button>
                </div>
                <button onclick="location.reload()" class="w-full text-slate-400 py-2 text-xs border border-slate-200 rounded-xl">Admin ထွက်မည်</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, doc, updateDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbRZLUYHeVThoCscb2ul_JURGsfBjCF4s",
            authDomain: "birthday-62720.firebaseapp.com",
            projectId: "birthday-62720",
            storageBucket: "birthday-62720.appspot.com",
            messagingSenderId: "915031456534",
            appId: "1:915031456534:web:04f11ac2cb812a9fb62e37"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let isAdmin = false;
        let currentTab = 'active';
        let allEvents = [];

        window.switchTab = (tab) => {
            currentTab = tab;
            document.getElementById('tab-active').className = tab === 'active' ? 'flex-1 py-2 text-sm font-bold rounded-xl bg-indigo-900 text-white' : 'flex-1 py-2 text-sm font-bold rounded-xl text-slate-500';
            document.getElementById('tab-done').className = tab === 'done' ? 'flex-1 py-2 text-sm font-bold rounded-xl bg-indigo-900 text-white' : 'flex-1 py-2 text-sm font-bold rounded-xl text-slate-500';
            renderEvents();
        };

        window.notify = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };

        window.checkAdmin = () => {
            if (document.getElementById('adminPass').value === "1234") {
                isAdmin = true;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
                renderEvents();
            } else notify("စကားဝှက်မှားပါသည်။");
        };

        window.addEvent = async () => {
            const date = document.getElementById('dateInput').value;
            const location = document.getElementById('locInput').value;
            const troupe = document.getElementById('troupeInput').value;
            if (!date || !location || !troupe) return notify("အချက်အလက်ဖြည့်ပါ။");
            await addDoc(collection(db, "events"), { date, location, troupe, completed: false, timestamp: new Date().getTime() });
            notify("ပွဲစဉ် တင်ပြီးပါပြီ။");
        };

        window.updateVideo = async () => {
            const vidId = document.getElementById('videoLink').value;
            if(!vidId) return;
            const url = `https://www.youtube.com/embed/${vidId}?modestbranding=1&rel=0&showinfo=0&controls=1&iv_load_policy=3&disablekb=1&fs=1&playsinline=1`;
            await setDoc(doc(db, "settings", "video"), { url });
            notify("ဗီဒီယို ပြောင်းလဲပြီးပါပြီ။");
        };

        window.markCompleted = async (id) => { await updateDoc(doc(db, "events", id), { completed: true }); };
        window.deleteEvent = async (id) => { await deleteDoc(doc(db, "events", id)); };

        function renderEvents() {
            const container = document.getElementById('schedule-body');
            const filtered = allEvents.filter(e => currentTab === 'active' ? !e.completed : e.completed);
            
            const sorted = filtered.sort((a, b) => {
                const dateA = new Date(a.date.split('/').reverse().join('-'));
                const dateB = new Date(b.date.split('/').reverse().join('-'));
                return dateA - dateB;
            });
            
            if(sorted.length === 0) return container.innerHTML = '<tr><td colspan="4" class="text-slate-400 text-center py-4">ပွဲစဉ်မရှိသေးပါ။</td></tr>';

            container.innerHTML = sorted.map(e => `
                <tr>
                    <td class="px-2 py-3">${e.date}</td>
                    <td class="px-2 py-3">${e.location}</td>
                    <td class="px-2 py-3">${e.troupe}</td>
                    <td class="px-2 py-3 text-center">
                        ${isAdmin ? `
                            <div class="flex flex-col gap-1">
                                ${!e.completed ? `<button onclick="markCompleted('${e.id}')" class="bg-emerald-600 text-white text-[10px] px-2 py-1 rounded">ပြီး</button>` : ''}
                                <button onclick="deleteEvent('${e.id}')" class="bg-red-500 text-white text-[10px] px-2 py-1 rounded">ဖျက်</button>
                            </div>
                        ` : (e.completed ? `<span class="text-slate-400 text-[10px]">ပြီး</span>` : `<span class="text-emerald-600 font-bold text-[10px]">ပွဲရှိ</span>`)}
                    </td>
                </tr>
            `).join('');
        }

        onSnapshot(query(collection(db, "events")), (s) => {
            allEvents = [];
            s.forEach(d => allEvents.push({ id: d.id, ...d.data() }));
            renderEvents();
        });

        onSnapshot(doc(db, "settings", "video"), (d) => {
            if(d.exists()) document.getElementById('video-frame').src = d.data().url;
        });
    </script>
</body>
</html>
