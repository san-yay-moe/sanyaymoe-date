<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>စမ်းရေမိုး - ဇာတ်ပွဲအချိန်ဇယား</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pyidaungsu', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-10">

    <div id="toast" class="fixed top-5 left-5 right-5 z-50 hidden bg-indigo-900 text-white px-6 py-3 rounded-xl shadow-lg text-center">
        <span id="toast-msg"></span>
    </div>

    <header class="bg-indigo-900 text-white py-8 px-4 text-center shadow-lg">
        <h1 class="text-3xl font-bold">စမ်းရေမိုး</h1>
        <p class="text-indigo-200 mt-1">ဇာတ်ပွဲများ အချိန်ဇယား</p>
    </header>

    <main class="max-w-md mx-auto px-4 py-6">
        <!-- YouTube Embed Section -->
        <section class="mb-8">
            <div class="aspect-video w-full rounded-3xl overflow-hidden shadow-lg bg-slate-200">
                <iframe class="w-full h-full" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </section>

        <section class="bg-white rounded-3xl shadow-sm border border-slate-100 p-5 mb-8">
            <h2 class="text-xl font-bold mb-4 text-indigo-900">📅 လာမည့် ပွဲစဉ်များ</h2>
            <div id="schedule-body" class="space-y-4">
                <p class="text-slate-400 text-center py-4">Data များတင်နေသည်...</p>
            </div>
        </section>

        <section class="mt-8 mb-12">
            <div id="login-form" class="bg-white p-6 rounded-3xl shadow-lg border border-indigo-100">
                <h3 class="font-bold text-slate-700 mb-4 text-center">Admin အတွက်</h3>
                <input id="adminPass" type="password" placeholder="စကားဝှက်" class="w-full p-4 mb-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="checkAdmin()" class="w-full bg-indigo-900 text-white py-3 rounded-xl font-bold active:scale-95 transition">ဝင်မည်</button>
            </div>
            
            <div id="admin-controls" class="hidden bg-white p-6 rounded-3xl shadow-xl space-y-4 border border-indigo-100">
                <h3 class="text-xl font-bold text-indigo-900 mb-2">Admin Control</h3>
                <input id="dateInput" type="text" placeholder="နေ့စွဲ (ဥပမာ - ၁-၁၁-၂၀၂၆)" class="w-full p-3 rounded-xl border">
                <input id="locInput" type="text" placeholder="နေရာ" class="w-full p-3 rounded-xl border">
                <input id="troupeInput" type="text" placeholder="ဇာတ်အဖွဲ့" class="w-full p-3 rounded-xl border">
                <button onclick="addEvent()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold active:scale-95 transition">ပွဲစဉ် တင်မည်</button>
                <button onclick="location.reload()" class="w-full text-slate-400 py-2 text-sm">Admin မှ ထွက်မည်</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbRZLUYHeVThoCscb2ul_JURGsfBjCF4s",
            authDomain: "birthday-62720.firebaseapp.com",
            projectId: "birthday-62720",
            storageBucket: "birthday-62720.appspot.com",
            messagingSenderId: "915031456534",
            appId: "1:915031456534:web:04f11ac2cb812a9fb62e37"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.notify = (msg) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        };

        window.addEvent = async () => {
            const date = document.getElementById('dateInput').value;
            const location = document.getElementById('locInput').value;
            const troupe = document.getElementById('troupeInput').value;

            if (!date || !location || !troupe) { notify("အချက်အလက်အားလုံးဖြည့်ပါ။"); return; }

            try {
                await addDoc(collection(db, "events"), { 
                    date, 
                    location, 
                    troupe, 
                    createdAt: serverTimestamp() 
                });
                notify("အောင်မြင်စွာ တင်ပြီးပါပြီ။");
                document.getElementById('dateInput').value = '';
                document.getElementById('locInput').value = '';
                document.getElementById('troupeInput').value = '';
            } catch (e) { 
                console.error("Firebase Error:", e);
                notify("အမှားအယွင်းရှိပါသည်။ Console ကြည့်ပါ။"); 
            }
        };

        window.checkAdmin = () => {
            if (document.getElementById('adminPass').value === "1234") {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('admin-controls').classList.remove('hidden');
            } else notify("စကားဝှက်မှားနေပါသည်။");
        };

        onSnapshot(query(collection(db, "events"), orderBy("createdAt", "desc")), (snapshot) => {
            const container = document.getElementById('schedule-body');
            container.innerHTML = '';
            if (snapshot.empty) {
                container.innerHTML = '<p class="text-slate-400 text-center py-4">ပွဲစဉ်များ မရှိသေးပါ။</p>';
                return;
            }
            snapshot.forEach((doc) => {
                const e = doc.data();
                container.innerHTML += `
                    <div class="flex items-center p-3 border-b border-slate-100">
                        <div class="bg-indigo-100 text-indigo-900 font-bold px-3 py-1 rounded-lg mr-3 text-xs whitespace-nowrap">${e.date}</div>
                        <div>
                            <div class="font-bold text-slate-800 text-sm">${e.location}</div>
                            <div class="text-xs text-indigo-600">${e.troupe}</div>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
